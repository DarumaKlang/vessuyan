

{ pair: '๑ ๑', meaning: 'คู่เจ้าระเบียบ', discription: 'พลังแห่งปัญญา วิสัยทัศน์ และสติปัญญา เลขนี้บ่งบอกถึงบุคคลที่มีความเป็นผู้นำสูง' },
{ pair: '๑ ๒', meaning: 'คู่ครัวเรือน คู่สมรส', discription: 'พลังแห่งความคิดสร้างสรรค์ การทำงานร่วมกับผู้อื่น และความสัมพันธ์ที่ดีในสังคม' },
{ pair: '๑ ๓', meaning: 'คู่ศัตรู วิปัสสนา หัวแตก', discription: 'วิธีแก้ : ให้ทาน รักษาศีล เจริญภาวนา ลงไปดูหน้างาน รู้ตามความเป็นจริง' },
{ pair: '๑ ๔', meaning: 'คู่แผนการ', discription: 'พลังความสามารถในการสื่อสาร และการบริหารจัดการที่ยอดเยี่ยม สะท้อนถึงบุคคลที่มีวิสัยทัศน์กว้างไกล' },
{ pair: '๑ ๕', meaning: 'คู่มิตร (ศิษย์ อาจารย์) ให้ผลด้านคู่ครอง คนช่วยเหลือ', discription: 'พลังความสำเร็จในด้านการเจรจาต่อรอง และ ความสัมพันธ์ สามารถสร้างความประทับใจแก่ผู้อื่นได้อย่างดี' },
{ pair: '๑ ๖', meaning: 'คู่สมพล (ให้ผลด้านการงานทุกครั้ง) ดีภายหลัง', discription: 'พลังแห่งความฉลาด รอบรู้ และความลึกซึ้งทางความคิด บ่งบอกถึงบุคคลที่มีความสามารถในการวางแผนและวิเคราะห์' },
{ pair: '๑ ๗', meaning: 'คู่ธาตุ ไฟ รุ่งเรืองปัญญา (ญาติ ยานพาหนะ)', discription: ' ' },
{ pair: '๑ ๘', meaning: 'คู่ฆาต สว่างไปมืดมาก มืดมาก็สว่างไป (สุริยฆาต)', discription: 'พลังแห่งความผกผัน ความไม่แน่นอนและการเปลี่ยนแปลงรวดเร็ว ความขัดแย้ง การต่อสู้ และอุปสรรค' },
{ pair: '๒ ๒', meaning: 'คู่บริการ คู่งอน', discription: 'อ่อนโยน อ่อนหวาน นุ่มนวล มีหัวใจบริการ เป็นมิตร เพื่อนมาก หาเงินเก่ง มีโชคลาภ' },
{ pair: '๒ ๓', meaning: 'คู่ชู้ คู่ทะเยอทะยาน ชู้จับได้', discription: 'ความรัก มีเสน่ห์ มักเป็นคนเจ้าชู้ ถือความรักเป็นใหญ่ เป็นคนสนใจเรื่องการศึกษาหาความรู้' },
{ pair: '๒ ๔', meaning: 'คู่มิตร ฉันและเธอ ให้ผลด้านคู่ครอง คนช่วยเหลือ', discription: 'พลังแห่งความสมดุลระหว่างความรักและการเงิน สื่อถึงเสน่ห์เมตตามหานิยม' },
{ pair: '๒ ๕', meaning: 'คู่ธาตุดิน ทรัพย์สินมั่นคง กระทบกระทั่งเล็กน้อย (ถ้ารถยนต์ = ชน)', discription: 'ดาวจันทร์และดาวพฤหัสบดี เป็นดาวศุภเคราะห์ทั้งคู่ จุดเด่นคือทำให้ชีวิตมั่นคง มีทรัพย์สินเงินทอง' },
{ pair: '๒ ๖', meaning: 'คู่สุริ สุร่าย', discription: 'ชอบช่วยเหลือผู้อื่นเสมอ ปลอบใจคนเก่ง มีคนมาขอคำปรึกษาบ่อย' },
{ pair: '๒ ๗', meaning: 'คู่พลัดพราก จะต้องแยกจากกัน', discription: 'ดวงชะตามีความผิดหวัง พลัดพราก ทุกข์ทั้งเรื่องการเงิน การงาน และความรัก' },
{ pair: '๒ ๘', meaning: 'คู่สมพล คู่หนี้ ประกอบกิจการต้องยืมเขามา', discription: 'หมุนเงินก้อนได้ดี กู้เงินธนาคารต่อยอดธุรกิจได้ง่าย เป็นคนมั่นใจในตัวเองสูง' },
{ pair: '๓ ๓', meaning: 'คู่การงาน งานช่าง คู่ทหารช่าง', discription: 'ขยัน พากเพียร อดทน ฝ่าฟันจนพบความสำเร็จ ข้อเสียคือ เป็นดาวบาปเคราะห์ทั้งคู่ จะมีอารมณ์ฉุนเฉียว วู่วาม ไม่มีเหตุผล' },
{ pair: '๓ ๔', meaning: 'คู่วิวาทะ ปากเบี้ยว (เลื่อยงา ผ่าท้อง)', discription: 'ไม่ชอบพึ่งพาใคร แต่ให้ระวังการขัดแย้งเพราะคำพูด อาจเกิดศัตรู' },
{ pair: '๓ ๕', meaning: 'คู่สมพล ได้ผลทางการงาน', discription: 'คล่องงานรอบตัว มีพรสวรรค์เข้ากับคนได้ทุกระดับขั้น จะประสบความสำเร็จดีโดยมีผู้ใหญ่อุปถัมภ์ค้ำซู' },
{ pair: '๓ ๖', meaning: 'คู่มิตร คู่เม้าท์', discription: 'ส่งผลให้ความรักสมหวังสดชื่น มีเสน่ห์ดึงดูดใจเพศตรงข้าม มีมิตรสหายมาก เป็นที่รัก' },
{ pair: '๓ ๗', meaning: 'คู่แตกหัก ขาดตอน (ปวดเท้า ปวดขา)', discription: 'คู่หักโค่น คู่จองเวร คู่สิ้นหวัง เป็นเลขร้าย เป็นดาวบาปเคราะห์คู่ศัตรู หมายถึงการวิวาทขัดแย้งทุกข์ทรมานจากโรคร้าย' },
{ pair: '๓ ๘', meaning: 'คู่ธาตุ ลม มีชื่อเสียง คล่องแคล่ว ว่องไว มีทรัพย์สิน ลมๆแล้ง (ไฟไหม้)', discription: 'เคลื่อนที่เร็ว มีพลังมาก ชอบเสี่ยง เป็นนักฉวยโอกาส ชอบงานท้าทาย ขยัน คิดเร็วทำเร็ว กล้าได้กล้าเสีย' },
{ pair: '๔ ๔', meaning: 'คู่เจรจา เดินทาง', discription: 'มีดีด้านวาจาน่าเชื่อถือและทำให้ประทับใจได้เสมอ ฝีปากดี ฉลาด ช่างคิดมีเสน่ห์ กล้าหาญ แต่บางครั้งอาจดื้อรั้น' },
{ pair: '๔ ๕', meaning: 'คู่วิชาการ', discription: 'ความฉลาดรอบรู้ มีเหตุผล และความมั่นคงในชีวิต' },
{ pair: '๔ ๖', meaning: 'คู่ธาตุน้ำ มนต์ กามรมณ์ เข้าวัดเข้าวา', discription: 'เป็นคนสติปัญญาดี มีรสนิยมสูง มีเสน่ห์ พูดจาดี ไม่ชอบหยุดนิ่งอยู่กับที่ การเงินคล่อง' },
{ pair: '๔ ๗', meaning: 'คู่สมพล (ให้ผลการงานระยะยาว)', discription: 'คู่นักพัฒนา เป็นเลขดีในเรื่องความเพียรความมานะพยายาม' },
{ pair: '๔ ๘', meaning: 'คู่ศัตรู', discription: 'หลงผิดเป็นชอบ ชีวิตมักผิดพลาดและได้รับอันตราย ถูกชักจูงจากคนพาลให้เข้ากลุ่ม ทำให้อยู่ในอบายมุข' },
{ pair: '๕ ๕', meaning: 'คู่เรียนรู้ คู่สอนสั่ง คู่มานะทิฐิ คู่บวชเรียน ลาออกจากงาน', discription: 'ดวงส่งเสริมหนุนนำให้อยู่สุขสบายไม่ลำบากมีปัญญา เที่ยงตรง รักความดี ชอบทำบุญ ชอบด้านศาสนาเป็นพิเศษ' },
{ pair: '๕ ๖', meaning: 'คู่สุภาพราบรื่น', discription: 'ฉลาดในการหาช่องทางทำเงิน สร้างรายได้หลายทาง ส่งเสริมให้เจริญรุ่งเรือง มีวิชาความรู้กว้างขวาง' },
{ pair: '๕ ๗', meaning: 'คู่พระ คู่ โจร (มีคุณธรรม มีพวกเยอะ)', discription: 'ขัดแย้งด้วยอิทธิพลรองเลข 7 ดาวเสาร์เป็นคนมีความคิดขัดแย้งในตัวเอง ค่อนข้างดื้อรั้นเอาแต่ใจตนเอง' },
{ pair: '๕ ๘', meaning: 'คู่โลกธรรม แจ่มแจ้ง เอาดีทั้งทางโลก และทางธรรม', discription: 'เลื่อนลอย หลงผิดได้ง่าย ทำคุณคนไม่ขึ้น มีปัญหาถาโถมเข้าใส่มากมาย แต่ฉลาด แก้ปัญหาเก่ง เอาตัวรอดเก่ง พลิกแพลงเก่ง' },
{ pair: '๖ ๖', meaning: 'คู่รัก คู่เงิน', discription: 'เป็นดาวด้านการเงินและความรักมาหนุนนำทั้งสองดวง ทำให้คล่องทั้งการเงินและความรัก หาเงินเก่งแต่ก็ใช้เก่ง มีโขคลาภไม่ขาด' },
{ pair: '๖ ๗', meaning: 'คู่ศัตรู', discription: 'คู่ละลายรัก ละลายทรัพย์ เป็นคู่เลขศาสตร์ที่มีอุปสรรคในชีวิตมากมาย มีปัญหาด้านการเงินรายจ่ายสูง แบกภาระเยอะ เครียด' },
{ pair: '๖ ๘', meaning: 'คู่ค้าขาย คู่ล้มละลาย ลงมือจะมือลงหุ้นกันแต่ไม่ดูให้ดีก็ล้มละลาย', discription: 'ชอบประพฤติผิดศีลธรรม ลุ่มหลงทางการเงินและความรัก หาเงินเก่ง หาเงินคล่องแต่ใข้จ่ายตามอารมณ์' },
{ pair: '๗ ๗', meaning: 'คู่เก็บเบี้ยใต้ถุนร้าน สะสมทรัพย์ คู่ขุมทรัพย์', discription: 'ดาวเสาร์ซ้อนกัน 2 ดวง ดาวทุกข์ 2 ดวง ทำให้มีทุกข์เป็น2 เท่า เป็นนักสู้ มีความรับผิดชอบสูง ทำงานหนัก เก็บกด เครียดจริงจังกับชีวิต' },
{ pair: '๗ ๘', meaning: 'คู่มิตร ค้าขาย', discription: 'คู่คหบดี คู่เศรษฐีนายทุนใหญ่ มีพรรคพวกและบริวารมากมาย มีอิทธิพลสูง ใจกว้างใจนักเลง มิตรรักใคร่ ผู้ใหญ่เอ็นดู รักเพื่อนพ้อง' },
{ pair: '๘ ๘', meaning: 'คู่กลับตัว คู่มืด คู่พนัน', discription: '"ราหูซ้อนราหู" ส่งเสริมให้คนหาเงินเก่ง ใจใหญ่ ใจถึง กล้าได้กล้าเสีย ฉลาด มีเล่ห์เหลี่ยม และว่องไวในการหาเงิน แต่ก็ใช้เงินเก่งเช่นกัน มักจะมีความคิดล้ำหน้า ชอบลองสิ่งใหม่ๆ' },